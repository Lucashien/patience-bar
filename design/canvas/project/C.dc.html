<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>C 極簡墨水</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif}
</style>
</helmet>
<div style="width:940px;height:900px;box-sizing:border-box;background:#E6E3DC;display:flex;gap:56px;padding:28px 40px;align-items:flex-start">

<!-- phone -->
<div style="width:390px;height:844px;border-radius:52px;border:10px solid #1B1B1F;box-sizing:border-box;overflow:hidden;background:#F8F6F1;color:#1A1A1A;flex-shrink:0">
  <div style="padding:66px 28px 26px;display:flex;flex-direction:column;height:100%;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700">耐心條</span>
      <span style="font-size:12px;color:#6B665E;letter-spacing:.12em">10 月 31 日</span>
    </div>

    <!-- me -->
    <div style="margin-top:46px">
      <div style="font-size:12px;letter-spacing:.16em;color:#6B665E">我</div>
      <div style="display:flex;align-items:flex-end;gap:12px;margin-top:2px">
        <span style="font-size:176px;font-weight:300;line-height:.9;letter-spacing:-.05em">71</span>
        <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#D98A00;margin-bottom:20px"></span>
      </div>
      <div style="font-family:'Noto Serif TC',serif;font-size:22px;font-weight:500;margin-top:14px">我心情不錯</div>
      <div style="height:6px;background:#DAD6CC;margin-top:20px"><div style="width:71%;height:100%;background:#D98A00"></div></div>
    </div>

    <!-- partner -->
    <div style="margin-top:34px;display:flex;align-items:baseline;gap:10px;border-top:1px solid #CFCAC0;padding-top:16px">
      <span style="font-size:12px;letter-spacing:.16em;color:#6B665E">對方</span>
      <span style="font-size:13px;color:#6B665E;flex-grow:1">「我心情不錯」</span>
      <span style="font-size:34px;font-weight:300">96</span>
    </div>
    <div style="height:3px;background:#DAD6CC;margin-top:8px"><div style="width:96%;height:100%;background:#1A1A1A"></div></div>

    <!-- actions -->
    <div style="margin-top:auto;display:flex;flex-direction:column">
      <button style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;height:64px;border-top:1px solid #1A1A1A">
        <span style="width:34px;height:34px;border-radius:50%;background:#1A1A1A;color:#F8F6F1;display:flex;align-items:center;justify-content:center;font-size:18px">↑</span>
        <span style="font-size:18px;font-weight:500;flex-grow:1">我好了</span><span style="font-size:15px;color:#6B665E">+10</span>
      </button>
      <button style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;height:64px;border-top:1px solid #CFCAC0;border-bottom:1px solid #1A1A1A">
        <span style="width:34px;height:34px;border-radius:50%;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;font-size:18px">↓</span>
        <span style="font-size:18px;font-weight:500;flex-grow:1">我有點煩</span><span style="font-size:15px;color:#6B665E">−10</span>
      </button>
      <div style="margin-top:18px;font-size:12px;line-height:1.9;color:#6B665E">我好了，耐心 +10　·　我需要先喘口氣，耐心 −10　·　對方好了</div>
    </div>
  </div>
</div>

<!-- widgets -->
<div style="display:flex;flex-direction:column;gap:36px;padding-top:40px">
  <div style="font-size:13px;font-weight:700;color:#7A6F66;letter-spacing:.1em">小尺寸</div>
  <div style="width:170px;height:170px;border-radius:34px;background:#F8F6F1;box-sizing:border-box;padding:16px 18px;color:#1A1A1A;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(40,30,10,.14)">
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;color:#6B665E"><span style="flex-grow:1">我</span><span style="width:8px;height:8px;border-radius:50%;background:#D98A00"></span></div>
    <div style="font-size:78px;font-weight:300;line-height:.95;letter-spacing:-.05em;margin-top:2px">71</div>
    <div style="height:5px;background:#DAD6CC;margin-top:auto"><div style="width:71%;height:100%;background:#D98A00"></div></div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px;font-size:11px;color:#6B665E"><span style="letter-spacing:.12em;flex-grow:1">對方</span><span style="font-size:15px;color:#1A1A1A;font-weight:500">96</span></div>
  </div>

  <div style="font-size:13px;font-weight:700;color:#7A6F66;letter-spacing:.1em">中尺寸</div>
  <div style="width:360px;height:170px;border-radius:34px;background:#F8F6F1;box-sizing:border-box;padding:16px 20px;color:#1A1A1A;display:flex;gap:20px;box-shadow:0 8px 24px rgba(40,30,10,.14)">
    <div style="flex-grow:1;display:flex;flex-direction:column">
      <div style="font-size:11px;letter-spacing:.12em;color:#6B665E">我</div>
      <div style="font-size:78px;font-weight:300;line-height:.95;letter-spacing:-.05em">71</div>
      <div style="height:5px;background:#DAD6CC;margin-top:auto"><div style="width:71%;height:100%;background:#D98A00"></div></div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px;font-size:11px;color:#6B665E"><span style="letter-spacing:.12em;flex-grow:1">對方</span><span style="font-size:15px;color:#1A1A1A;font-weight:500">96</span></div>
    </div>
    <div style="width:96px;display:flex;flex-direction:column;justify-content:center;gap:12px">
      <div style="height:44px;border-radius:22px;background:#1A1A1A;color:#F8F6F1;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">↑ 我好了</div>
      <div style="height:44px;border-radius:22px;border:1.5px solid #1A1A1A;box-sizing:border-box;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px">↓ 有點煩</div>
    </div>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":940,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
