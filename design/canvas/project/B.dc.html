<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>B 遊戲血條</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif}
</style>
</helmet>
<div style="width:940px;height:900px;box-sizing:border-box;background:#EFE6D2;display:flex;gap:56px;padding:28px 40px;align-items:flex-start">

<!-- phone -->
<div style="width:390px;height:844px;border-radius:52px;border:10px solid #1B1B1F;box-sizing:border-box;overflow:hidden;background-color:#FFE8A3;background-image:radial-gradient(rgba(59,42,32,.13) 2px,transparent 2.5px);background-size:22px 22px;color:#3B2A20;flex-shrink:0">
  <div style="padding:62px 20px 22px;display:flex;flex-direction:column;gap:16px;height:100%;box-sizing:border-box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:30px;font-weight:900;letter-spacing:.02em">耐心條</span>
      <span style="font-size:13px;font-weight:700;background:#fff;border:3px solid #3B2A20;border-radius:14px;padding:3px 10px;box-shadow:0 3px 0 #3B2A20">晴</span>
    </div>

    <!-- partner -->
    <div style="background:#fff;border:3px solid #3B2A20;border-radius:22px;box-shadow:0 5px 0 #3B2A20;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:16px;font-weight:900;flex-grow:1">對方</span>
        <span style="font-size:13px;font-weight:700;opacity:.7">「我心情不錯」</span>
        <span style="font-size:20px;font-weight:900">96</span>
      </div>
      <div style="display:flex;gap:3px">
        <i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i><i style="flex:1;height:14px;border-radius:5px;background:#7BC96F;border:2px solid #3B2A20"></i>
      </div>
    </div>

    <!-- me -->
    <div style="background:#fff;border:3px solid #3B2A20;border-radius:26px;box-shadow:0 7px 0 #3B2A20;padding:18px 16px 18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:48px;height:48px;border-radius:50%;background:#FFD23F;border:3px solid #3B2A20;display:flex;align-items:center;justify-content:center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3B2A20" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        </div>
        <div style="flex-grow:1;display:flex;flex-direction:column">
          <span style="font-size:13px;font-weight:700;opacity:.7">我的耐心 HP</span>
          <span style="font-size:17px;font-weight:900">我心情不錯</span>
        </div>
        <span style="font-size:56px;font-weight:900;line-height:1">71</span>
      </div>
      <div style="display:flex;gap:4px">
        <i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#7BC96F;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#EDE3CC;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#EDE3CC;border:3px solid #3B2A20"></i><i style="flex:1;height:30px;border-radius:8px;background:#EDE3CC;border:3px solid #3B2A20"></i>
      </div>
    </div>

    <!-- actions -->
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:4px">
      <button style="all:unset;box-sizing:border-box;cursor:pointer;height:58px;border-radius:20px;background:#8DDB7A;border:3px solid #3B2A20;box-shadow:0 5px 0 #3B2A20;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;color:#3B2A20">▲　我好了　+10</button>
      <button style="all:unset;box-sizing:border-box;cursor:pointer;height:58px;border-radius:20px;background:#FF9F8A;border:3px solid #3B2A20;box-shadow:0 5px 0 #3B2A20;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;color:#3B2A20">▼　我有點煩　−10</button>
    </div>

    <div style="background:#fff;border:3px solid #3B2A20;border-radius:18px;padding:10px 14px;font-size:13px;line-height:1.8;font-weight:500;margin-top:4px">
      <b style="font-weight:900">最近發生的事</b><br>我好了，耐心 +10<br>我需要先喘口氣，耐心 −10
    </div>
  </div>
</div>

<!-- widgets -->
<div style="display:flex;flex-direction:column;gap:36px;padding-top:40px">
  <div style="font-size:13px;font-weight:700;color:#7A6F66;letter-spacing:.1em">小尺寸</div>
  <div style="width:170px;height:170px;border-radius:34px;background-color:#FFE8A3;background-image:radial-gradient(rgba(59,42,32,.13) 2px,transparent 2.5px);background-size:18px 18px;box-sizing:border-box;padding:14px;color:#3B2A20;display:flex;flex-direction:column;gap:8px;justify-content:center;box-shadow:0 8px 24px rgba(60,40,10,.2)">
    <div style="background:#fff;border:2.5px solid #3B2A20;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;font-size:11px;font-weight:900"><span style="flex-grow:1">對方</span><span>96</span></div>
      <div style="height:7px;border-radius:4px;background:#EDE3CC;border:1.5px solid #3B2A20;overflow:hidden"><div style="width:96%;height:100%;background:#7BC96F"></div></div>
    </div>
    <div style="background:#fff;border:3px solid #3B2A20;border-radius:16px;box-shadow:0 3px 0 #3B2A20;padding:8px 10px;display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:baseline;font-size:12px;font-weight:900"><span style="flex-grow:1">我</span><span style="font-size:30px;line-height:1">71</span></div>
      <div style="display:flex;gap:2px"><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#7BC96F;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#EDE3CC;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#EDE3CC;border:1.5px solid #3B2A20"></i><i style="flex:1;height:12px;border-radius:3px;background:#EDE3CC;border:1.5px solid #3B2A20"></i></div>
    </div>
  </div>

  <div style="font-size:13px;font-weight:700;color:#7A6F66;letter-spacing:.1em">中尺寸</div>
  <div style="width:360px;height:170px;border-radius:34px;background-color:#FFE8A3;background-image:radial-gradient(rgba(59,42,32,.13) 2px,transparent 2.5px);background-size:18px 18px;box-sizing:border-box;padding:14px;color:#3B2A20;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(60,40,10,.2)">
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:8px">
      <div style="background:#fff;border:2.5px solid #3B2A20;border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;font-size:11px;font-weight:900"><span style="flex-grow:1">對方</span><span>96</span></div>
        <div style="height:7px;border-radius:4px;background:#EDE3CC;border:1.5px solid #3B2A20;overflow:hidden"><div style="width:96%;height:100%;background:#7BC96F"></div></div>
      </div>
      <div style="background:#fff;border:3px solid #3B2A20;border-radius:16px;box-shadow:0 3px 0 #3B2A20;padding:8px 10px;display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:baseline;font-size:12px;font-weight:900"><span style="flex-grow:1">我</span><span style="font-size:30px;line-height:1">71</span></div>
        <div style="height:12px;border-radius:5px;background:#EDE3CC;border:2px solid #3B2A20;overflow:hidden"><div style="width:71%;height:100%;background:#7BC96F"></div></div>
      </div>
    </div>
    <div style="width:104px;display:flex;flex-direction:column;gap:10px">
      <div style="height:48px;border-radius:14px;background:#8DDB7A;border:3px solid #3B2A20;box-shadow:0 3px 0 #3B2A20;box-sizing:border-box;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center">▲ 我好了</div>
      <div style="height:48px;border-radius:14px;background:#FF9F8A;border:3px solid #3B2A20;box-shadow:0 3px 0 #3B2A20;box-sizing:border-box;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center">▼ 有點煩</div>
    </div>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":940,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
